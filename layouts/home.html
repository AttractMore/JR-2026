{{- define "main" }}
<div class="home" itemscope itemtype="https://schema.org/BlogPosting">
  <section class="wrap">
    <h1>{{ .Params.pageTitle }}</h1>
    <article class="grid-col-12">
      <div class="content">
        {{ .Content }}
        <p class="standard-button">
          <a href="/contact/">Contact</a>
        </p>
      </div>
      <aside> {{partial "sidebar-image.html" . }} </aside>
    </article>
  </section>
</div>
{{- end }}{{/* end main */}}
