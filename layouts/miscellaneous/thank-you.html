{{- define "main" }}
<div class="thank-you" itemscope itemtype="https://schema.org/BlogPosting">
  <section class="wrap">
    <h1>{{ .Title}}</h1>
    <article class="grid-col-12">
      <div class="content"> {{ .Content }} </div>
      <aside> {{partial "sidebar-image.html" . }} </aside>
    </article>
  </section>
</div>
{{- end }}{{/* end main */}}
